
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "processfoundry-ai"
version = "0.1.0"
description = "AI-assisted process discovery and workflow design"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "langgraph",
    "streamlit",
    "pymupdf",
    "python-docx",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]